{% extends "base.html" %}
{% block title %}Delete task{% endblock %}
{% block content %}
  <div class="modal-backdrop show"></div>
  <div class="modal fade show d-block confirm-modal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="deleteTaskTitle">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 shadow">
      <div class="modal-header"><h1 class="modal-title fs-5" id="deleteTaskTitle">Delete “{{ task.title }}”?</h1></div>
      <div class="modal-body"><p class="mb-0">This task will be permanently removed from {{ task.project.name }}.</p></div>
      <div class="modal-footer">
        <a class="btn btn-outline-secondary" href="{% url 'tasks:task_detail' task.pk %}">Cancel</a>
        <form method="post">{% csrf_token %}<button class="btn btn-danger" type="submit">Delete task</button></form>
      </div>
    </div></div>
  </div>
{% endblock %}
