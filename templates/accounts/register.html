{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block public_content %}
  <section class="auth-panel">
    <a class="brand" href="{% url 'accounts:register' %}"><span class="brand-mark"><i class="bi bi-check2" aria-hidden="true"></i></span><span>daymark</span></a>
    <h1>Create your workspace</h1>
    <p>One account for your projects and daily work.</p>
    <form method="post">
      {% csrf_token %}
      {% include "includes/form_fields.html" with form=form %}
      <button class="btn btn-primary w-100 py-2" type="submit">Create account</button>
    </form>
    <p class="mb-0 mt-4 text-center small">Already registered? <a href="{% url 'accounts:login' %}">Sign in</a></p>
  </section>
{% endblock %}
