<a class="project-card" href="{% url 'projects:project_detail' project.pk %}">
  <span class="project-icon"><i class="bi bi-folder2" aria-hidden="true"></i></span>
  <h2>{{ project.name }}</h2>
  <p>{{ project.description|default:"No description yet."|truncatewords:18 }}</p>
  <div class="project-card-meta">
    <span><i class="bi bi-check2-square me-1" aria-hidden="true"></i>{{ project.task_count }} tasks</span>
    <span>Updated {{ project.updated_at|date:"M j" }}</span>
  </div>
</a>
